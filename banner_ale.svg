<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29E0C4"/>
      <stop offset="55%" stop-color="#8C7CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="grid2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1B2333" stroke-width="1"/>
    </pattern>
    <clipPath id="clip2">
      <rect x="0" y="0" width="1200" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip2)">
    <rect width="1200" height="260" fill="url(#bg2)"/>
    <rect width="1200" height="260" fill="url(#grid2)"/>

    <!-- corner reticle, consistent with profile identity -->
    <g stroke="#29E0C4" stroke-width="2.5" fill="none" opacity="0.5">
      <path d="M28,20 L28,44 M28,20 L52,20"/>
      <path d="M1172,20 L1172,44 M1172,20 L1148,20"/>
      <path d="M28,240 L28,216 M28,240 L52,240"/>
      <path d="M1172,240 L1172,216 M1172,240 L1148,240"/>
    </g>

    <!-- scanning line -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#29E0C4" stroke-width="1.5" opacity="0.45">
      <animate attributeName="y1" values="0;260;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;260;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- big name, textLength forces it to fit regardless of which font the viewer falls back to -->
    <text x="600" y="122" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="72" fill="url(#nameGrad)" textLength="1040" lengthAdjust="spacingAndGlyphs">NICOLE ALEJANDRA</text>

    <!-- divider -->
    <line x1="200" y1="152" x2="1000" y2="152" stroke="#1F2B40" stroke-width="1.5"/>

    <!-- subtitle, also fit-constrained -->
    <text x="600" y="182" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8B96AC" textLength="870" lengthAdjust="spacingAndGlyphs">ENGENHARIA DE SOFTWARE &#8226; SEGURANÇA DA INFORMAÇÃO &amp; DADOS &#8226; CIBERSEGURANÇA</text>

    <!-- status chip -->
    <g transform="translate(497,206)">
      <rect width="206" height="30" rx="6" fill="#0F1B22" stroke="#29E0C4" stroke-width="1" opacity="0.9"/>
      <circle cx="18" cy="15" r="4" fill="#29E0C4">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#29E0C4">STATUS: EM FORMAÇÃO</text>
    </g>
  </g>
</svg>
