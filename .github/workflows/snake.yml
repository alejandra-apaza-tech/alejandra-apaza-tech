name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # roda 1x por dia
  workflow_dispatch: {} # permite rodar manualmente também

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=a855f7&color_dots=1b1f24,4c1d95,7c3aed,a855f7,d8b4fe
            dist/github-contribution-grid-snake-dark.svg?color_snake=c4b5fd&color_dots=0d1117,4c1d95,7c3aed,a855f7,e9d5ff

      - name: publicar no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
